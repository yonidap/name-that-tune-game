name: Fix display restore key

on:
  push:
    paths:
      - '.github/workflows/fix-display-restore-key.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix display restore storage key and regression test
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('public/game.js')
          s = p.read_text()
          old = "const saved = readStoredJson('ttt-display');"
          new = "const saved = readStoredJson('ntt-display');"
          if old not in s:
              raise SystemExit('display restore typo not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/resilience-audit.test.js')
          s = p.read_text()
          marker = "  assert.match(game, /isTransientRestoreError/, 'transient restore failures must keep valid sessions');\n"
          addition = marker + "  assert.match(game, /readStoredJson\\('ntt-display'\\)/, 'display refresh must restore from the same storage key used by saveDisplay');\n  assert.doesNotMatch(game, /ttt-display/, 'legacy typo must never return');\n"
          if marker not in s:
              raise SystemExit('resilience audit insertion point not found')
          p.write_text(s.replace(marker, addition, 1))
          PY
      - run: npm run check
      - run: npm test
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-display-restore-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js test/resilience-audit.test.js .github/workflows/fix-display-restore-key.yml
          git commit -m "Fix display refresh session restore key"
          git push
