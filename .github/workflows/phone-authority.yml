name: Phone authoritative state hardening

on:
  push:
    branches: [main]
    paths:
      - 'scripts/phone-authority-patch.mjs'
      - 'scripts/phone-authority-fixup.mjs'
      - 'scripts/phone-authority-reclaim-fixup.mjs'
      - 'scripts/phone-authority-test-fixup.mjs'
      - 'test/phone-authority.test.js'
      - '.github/workflows/phone-authority.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply phone authoritative-state patch
        run: |
          node scripts/phone-authority-patch.mjs
          node scripts/phone-authority-fixup.mjs
          node scripts/phone-authority-reclaim-fixup.mjs
          node scripts/phone-authority-test-fixup.mjs
      - name: Syntax audit
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Commit clean implementation
        run: |
          rm -f scripts/phone-authority-patch.mjs
          rm -f scripts/phone-authority-fixup.mjs
          rm -f scripts/phone-authority-reclaim-fixup.mjs
          rm -f scripts/phone-authority-test-fixup.mjs
          rm -f .github/workflows/phone-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make phone state polling authoritative" || exit 0
          git push origin HEAD:main
