name: Captain live sync fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply captain live sync fixes
        run: node scripts/captain-sync-patch.mjs
      - name: Syntax audit
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Commit clean implementation
        run: |
          rm -f scripts/captain-sync-patch.mjs
          rm -f .github/workflows/captain-live-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden captain live state recovery" || exit 0
          git push origin HEAD:main
