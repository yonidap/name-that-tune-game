name: Fix captain session recovery

on:
  push:
    paths:
      - '.github/workflows/fix-captain-session.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch captain restore and active-team persistence
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('public/game.js')
          s = p.read_text()
          old = "function saveCaptain() { localStorage.setItem(`ntt-captain-${roomCode}-${team}`, JSON.stringify({ roomCode, team, captainToken })); }"
          new = "function saveCaptain() { localStorage.setItem(`ntt-captain-${roomCode}-${team}`, JSON.stringify({ roomCode, team, captainToken })); localStorage.setItem(`ntt-captain-active-${roomCode}`, team); }"
          if old not in s:
              raise SystemExit('saveCaptain block not found')
          s = s.replace(old, new, 1)

          old = """  if (mode === 'captain' && roomFromPath) {\n    for (const t of ['A','B']) {\n      const saved = JSON.parse(localStorage.getItem(`ntt-captain-${roomFromPath}-${t}`) || 'null');\n      if (!saved?.captainToken) continue;\n      const result = await api('/api/captain/join', saved);\n      if (result?.ok) { roomCode = roomFromPath; team = t; captainToken = saved.captainToken; state = result.state; connectEvents(); render(); return; }\n      localStorage.removeItem(`ntt-captain-${roomFromPath}-${t}`);\n    }\n  }\n"""
          new = """  if (mode === 'captain' && roomFromPath) {\n    const activeTeam = localStorage.getItem(`ntt-captain-active-${roomFromPath}`);\n    const restoreOrder = ['A','B'].includes(activeTeam) ? [activeTeam, activeTeam === 'A' ? 'B' : 'A'] : ['A','B'];\n    for (const t of restoreOrder) {\n      const saved = JSON.parse(localStorage.getItem(`ntt-captain-${roomFromPath}-${t}`) || 'null');\n      if (!saved?.captainToken) continue;\n      const result = await api('/api/captain/join', saved);\n      if (result?.ok) {\n        roomCode = roomFromPath; team = t; captainToken = result.captainToken || saved.captainToken; state = result.state;\n        saveCaptain(); connectEvents(); render(); return;\n      }\n      localStorage.removeItem(`ntt-captain-${roomFromPath}-${t}`);\n      if (activeTeam === t) localStorage.removeItem(`ntt-captain-active-${roomFromPath}`);\n    }\n  }\n"""
          if old not in s:
              raise SystemExit('captain restore block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('public/interaction-ui.js')
          s = p.read_text()
          old = """function captainSession() {\n  if (!isCaptainRoute) return null;\n  const roomCode = String(routeParts[1]).toUpperCase();\n  for (const team of ['A', 'B']) {\n    try {\n      const saved = JSON.parse(localStorage.getItem(`ntt-captain-${roomCode}-${team}`) || 'null');\n      if (saved?.captainToken) return { roomCode, team, token: saved.captainToken };\n    } catch {}\n  }\n  return null;\n}\n"""
          new = """function captainSession() {\n  if (!isCaptainRoute) return null;\n  const roomCode = String(routeParts[1]).toUpperCase();\n  const activeTeam = localStorage.getItem(`ntt-captain-active-${roomCode}`);\n  const teams = ['A','B'].includes(activeTeam) ? [activeTeam, activeTeam === 'A' ? 'B' : 'A'] : ['A','B'];\n  for (const team of teams) {\n    try {\n      const saved = JSON.parse(localStorage.getItem(`ntt-captain-${roomCode}-${team}`) || 'null');\n      if (saved?.captainToken) return { roomCode, team, token: saved.captainToken };\n    } catch {}\n  }\n  return null;\n}\n"""
          if old not in s:
              raise SystemExit('interaction captainSession block not found')
          s = s.replace(old, new, 1)
          old = "localStorage.setItem(`ntt-captain-${session.roomCode}-${session.team}`, JSON.stringify({ roomCode:session.roomCode, team:session.team, captainToken:result.captainToken }));"
          new = old + "\n      localStorage.setItem(`ntt-captain-active-${session.roomCode}`, session.team);"
          if old not in s:
              raise SystemExit('reconnect token save not found')
          p.write_text(s.replace(old, new, 1))

          Path('test/captain-session.test.js').write_text("""import assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst game = fs.readFileSync('public/game.js', 'utf8');\nconst interaction = fs.readFileSync('public/interaction-ui.js', 'utf8');\n\nassert.match(game, /captainToken = result\\.captainToken \\|\\| saved\\.captainToken/, 'captain restore must use the token returned by the server');\nassert.match(game, /ntt-captain-active-\\$\\{roomCode\\}/, 'captain join must persist the active team');\nassert.match(game, /restoreOrder = .*activeTeam/, 'captain restore must prefer the active team instead of always Team A');\nassert.match(interaction, /ntt-captain-active-\\$\\{roomCode\\}/, 'reconnect controls must prefer the active team');\nconsole.log('Captain session recovery test passed');\n""")

          p = Path('package.json')
          s = p.read_text()
          s = s.replace("node --check test/style-architecture.test.js\"", "node --check test/style-architecture.test.js && node --check test/captain-session.test.js\"")
          s = s.replace("node test/style-architecture.test.js\"", "node test/style-architecture.test.js && node test/captain-session.test.js\"")
          p.write_text(s)
          PY
      - run: npm run check
      - run: npm test
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-captain-session.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js public/interaction-ui.js test/captain-session.test.js package.json .github/workflows/fix-captain-session.yml
          git commit -m "Fix captain token rotation and team restore"
          git push
