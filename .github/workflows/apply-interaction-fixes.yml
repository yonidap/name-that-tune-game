name: Apply interaction fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[interaction-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch server state logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.js')
          s = p.read_text()

          replacements = [
            ("    awaitingReplay: room.awaitingReplay,\n    canPlay:", "    awaitingReplay: room.awaitingReplay,\n    replayStarted: room.replayStarted,\n    canPlay:"),
            ("    awaitingReplay: room.awaitingReplay,\n    playbackSeq:", "    awaitingReplay: room.awaitingReplay,\n    replayStarted: room.replayStarted,\n    playbackSeq:"),
            ("  room.awaitingReplay = false;\n  room.playbackSeq = 0;", "  room.awaitingReplay = false;\n  room.replayStarted = false;\n  room.playbackSeq = 0;"),
            ("      currentPoints: 10, playbacksCompleted: 0, awaitingReplay: false, playbackSeq: 0,", "      currentPoints: 10, playbacksCompleted: 0, awaitingReplay: false, replayStarted: false, playbackSeq: 0,"),
            ("    if (room.awaitingReplay) {\n      room.audioPosition = 0;\n      room.awaitingReplay = false;\n    }\n    room.playbackSeq += 1;\n    room.phase = 'PLAYING';\n    sendDisplayEvent(room, 'audio-play', { startAt: room.audioPosition, seq: room.playbackSeq });\n    broadcastState(room);\n    return json(res, 200, { ok: true, playbackSeq: room.playbackSeq });",
             "    if (room.awaitingReplay && !room.replayStarted) {\n      room.audioPosition = 0;\n      room.awaitingReplay = false;\n      room.replayStarted = true;\n    }\n    const startAt = room.audioPosition;\n    room.playbackSeq += 1;\n    room.phase = 'PLAYING';\n    sendDisplayEvent(room, 'audio-play', { startAt, seq: room.playbackSeq });\n    broadcastState(room);\n    return json(res, 200, { ok: true, playbackSeq: room.playbackSeq, startAt });"),
            ("    room.awaitingReplay = room.playbacksCompleted < 2;", "    room.awaitingReplay = room.playbacksCompleted === 1;"),
            ("    snapshot(room);\n    clearStealTimer(room);\n    room.phase = 'STEAL_LOCKED';", "    snapshot(room);\n    clearStealTimer(room);\n    room.stealDeadline = null;\n    room.phase = 'STEAL_LOCKED';")
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one server match, got {count}: {old[:80]!r}')
            s = s.replace(old, new, 1)

          anchor = "  if (action === 'captain:lockSteal') {"
          dont_know = """  if (action === 'captain:dontKnow') {
            if (room.activeTeam !== body.team) return json(res, 409, { ok: false, error: 'NOT_ALLOWED' });
            if (['READY', 'PAUSED'].includes(room.phase)) {
              if (room.totalHeardSeconds < 0.05) return json(res, 409, { ok: false, error: 'HEAR_SOMETHING_FIRST' });
              snapshot(room); startSteal(room); broadcastState(room); return json(res, 200, { ok: true, steal: true });
            }
            if (room.phase === 'STEAL') {
              snapshot(room); reveal(room); broadcastState(room); return json(res, 200, { ok: true, reveal: true });
            }
            return json(res, 409, { ok: false, error: 'NOT_ALLOWED' });
          }
"""
          if s.count(anchor) != 1:
            raise SystemExit('Could not locate captain:lockSteal anchor')
          s = s.replace(anchor, dont_know + anchor, 1)

          p.write_text(s)
          PY
          node --check src/server.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "[interaction-fixes] Fix replay, pass and steal timer"
          git push
