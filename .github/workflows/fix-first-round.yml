name: Fix first round server state

on:
  push:
    paths:
      - '.github/workflows/fix-first-round.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch first-round state and regression tests
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/server.js')
          s = p.read_text()
          old = """  if (action === 'host:start') {\n    if (room.phase !== 'LOBBY') return json(res, 409, { ok: false, error: 'NOT_ALLOWED' });\n    if (!readyToStart(room)) return json(res, 409, { ok: false, error: 'ROOM_NOT_READY' });\n    snapshot(room); loadSong(room, 0); broadcastState(room); return json(res, 200, { ok: true });\n  }\n"""
          new = """  if (action === 'host:start') {\n    if (room.phase !== 'LOBBY') return json(res, 409, { ok: false, error: 'NOT_ALLOWED' });\n    if (!readyToStart(room)) return json(res, 409, { ok: false, error: 'ROOM_NOT_READY' });\n    snapshot(room);\n    loadSong(room, 0);\n    // Song 1 must be playable immediately after START GAME.\n    // ROUND_INTRO is reserved for later difficulty transitions.\n    if (room.currentIndex === 0 && room.phase === 'ROUND_INTRO') room.phase = 'READY';\n    broadcastState(room);\n    return json(res, 200, { ok: true });\n  }\n"""
          if old not in s:
              raise SystemExit('Expected host:start block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/integration.test.js')
          s = p.read_text()
          old_assert = "  assert.equal(state.phase, 'ROUND_INTRO');\n  assert.equal(state.currentPoints, 10);"
          new_assert = "  assert.equal(state.phase, 'READY', 'START GAME must make song 1 playable immediately');\n  assert.equal(state.currentPoints, 10);"
          if old_assert not in s:
              raise SystemExit('Expected integration start assertion not found')
          s = s.replace(old_assert, new_assert, 1)
          first_begin = "  assert.equal((await post('/api/action', { action:'host:beginRound', roomCode, token:hostToken })).status, 200);\n"
          if first_begin not in s:
              raise SystemExit('Expected integration beginRound call not found')
          s = s.replace(first_begin, '', 1)
          p.write_text(s)

          p = Path('test/interaction-fixes.test.js')
          s = p.read_text()
          old_start = "  await post('/api/action', { action:'host:start', roomCode, token:hostToken });\n  await post('/api/action', { action:'host:beginRound', roomCode, token:hostToken });\n\n  let state = (await post('/api/host/join', { roomCode, hostToken })).body.state;"
          new_start = "  await post('/api/action', { action:'host:start', roomCode, token:hostToken });\n\n  let state = (await post('/api/host/join', { roomCode, hostToken })).body.state;\n  assert.equal(state.phase, 'READY', 'START GAME must skip the initial Easy round intro');"
          if old_start not in s:
              raise SystemExit('Expected interaction start sequence not found')
          p.write_text(s.replace(old_start, new_start, 1))
          PY
      - run: npm run check
      - run: npm test
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/fix-first-round.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js test/integration.test.js test/interaction-fixes.test.js .github/workflows/fix-first-round.yml
          git commit -m "Make first song playable immediately on start"
          git push
