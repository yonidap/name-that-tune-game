name: Durability fixes
# corrected patch validation

on:
  push:
    paths:
      - '.github/workflows/durability-fixes.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply durability fixes
        run: node scripts/durability-patch.mjs
      - name: Syntax audit
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/durability-patch.mjs .github/workflows/durability-fixes.yml
          git add -A
          git commit -m "Add durable room recovery and keepalive"
          git push origin main
