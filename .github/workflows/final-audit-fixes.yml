name: Final audit fixes

'on':
  push:
    paths:
      - '.github/workflows/final-audit-fixes.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final audit fixes
        run: node scripts/final-audit-patch.mjs
      - name: Syntax audit
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/final-audit-patch.mjs .github/workflows/final-audit-fixes.yml
          git add -A
          git commit -m "Finish full-game resilience audit"
          git push origin main
