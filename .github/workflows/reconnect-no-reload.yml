name: Reconnect no-reload hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reconnect hardening
        run: node scripts/reconnect-no-reload.mjs
      - name: Syntax audit
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Commit clean implementation
        run: |
          rm -f scripts/reconnect-no-reload.mjs
          rm -f .github/workflows/reconnect-no-reload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove reload from captain reconnect" || exit 0
          git push origin HEAD:main
